# Personaliza estas opciones antes de publicar.
title: "CyberSec | Research & Labs"
description: "Investigación, defensa, laboratorios y aprendizaje de ciberseguridad."
url: "https://notrustedx.github.io"
baseurl: "" # Repositorio principal NoTrustedx/notrustedx.github.io
lang: es
author:
  name: "NoTrustedX"
  bio: "Compartiendo aprendizaje y experimentación responsable en seguridad."
  github: "NoTrustedx"
permalink: /articulos/:year/:month/:day/:title/
markdown: kramdown
highlighter: rouge
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
feed:
  path: feed.xml
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
exclude:
  - README.md
  - DEPLOY.md
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - scripts/
  - vendor/
  - .github/
  - node_modules/
